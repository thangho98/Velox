# Test: Library browsing and media navigation
# Prerequisite: Already logged in, has at least 1 library with media
appId: com.velox.app
---

# Navigate to a library (tap first library on home screen)
- scrollUntilVisible:
    element: "Libraries"
    direction: DOWN

# Tap first library card
- tapOn:
    index: 0
    below: "Libraries"

# Should see library browse screen with media
- assertVisible:
    text: ".*"
    timeout: 5000

# Verify sort buttons exist
- assertVisible: "Newest"

# Verify search input exists
- runFlow:
    when:
      visible: "Search"
    commands:
      - assertVisible: "Search"

# Test sort toggle
- tapOn: "A-Z"

# Take screenshot
- takeScreenshot: library-browse
