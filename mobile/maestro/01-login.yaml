# Test: Login flow (server URL → credentials → home screen)
appId: com.velox.app
---

# Step 1: App should show login screen
- assertVisible: "Velox"

# Step 2: Enter server URL (first-time setup)
- runFlow:
    when:
      visible: "Server URL"
    commands:
      - tapOn: "Server URL"
      - eraseText
      - inputText: ${SERVER_URL}
      - tapOn: "Connect"
      - assertVisible: "Username"

# Step 3: Enter credentials
- tapOn: "Username"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"

# Step 4: Should navigate to Home screen
- assertVisible:
    text: "Continue Watching|Recently Added|Welcome"
    timeout: 10000
