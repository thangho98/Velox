# Test: Video player basic controls
# Prerequisite: Already logged in, has playable media
appId: com.velox.app
---

# Navigate to a media and play
- scrollUntilVisible:
    element: "Recently Added"
    direction: DOWN

# Tap first media
- tapOn:
    index: 0
    below: "Recently Added"

# Wait for detail page
- assertVisible:
    text: "Play"
    timeout: 5000

# Tap Play button
- tapOn: "Play"

# Should enter video player
- assertVisible:
    text: ".*"
    timeout: 10000

# Tap screen to show controls
- tapOn:
    point: "50%,50%"

# Verify player controls visible
- runFlow:
    when:
      visible: "CC"
    commands:
      - assertVisible: "CC"

# Take screenshot of player
- takeScreenshot: video-player

# Close player (tap X or back)
- pressKey: back
